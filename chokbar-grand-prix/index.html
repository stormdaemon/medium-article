<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOKBAR GRAND PRIX</title><body style="margin:0;background:#111;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh">Chargement du Grand Prix…<script>(async()=>{try{const p=await Promise.all([...Array(6)].map((_,i)=>fetch(`part${i}.txt?v=1`).then(r=>{if(!r.ok)throw new Error('part'+i);return r.text()})));document.open();document.write(p.join(''));document.close()}catch(e){document.body.innerHTML='<div style="padding:24px;text-align:center"><h1>CHOKBAR GRAND PRIX</h1><p>Erreur de chargement. Recharge la page.</p></div>'}})();</script></body>
