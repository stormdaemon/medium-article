<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>GLM Canvas Chat</title>
<style>
html,body{height:100%;margin:0;background:#0f1012;color:#f5f5f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}.load{display:grid;gap:12px;text-align:center}.dot{width:12px;height:12px;margin:auto;border-radius:50%;background:#b7f34a;box-shadow:0 0 0 8px #b7f34a22;animation:p 1s infinite}@keyframes p{50%{transform:scale(.7);opacity:.5}}small{color:#a2a4aa;max-width:300px;line-height:1.5}
</style>
</head>
<body>
<div class="load"><div class="dot"></div><strong>GLM Canvas Chat</strong><small id="s">Chargement de la V2.2…</small></div>
<script>
(async()=>{
 const status=document.getElementById('s');
 try{
  if(!('DecompressionStream' in window)) throw new Error('Navigateur trop ancien : DecompressionStream indisponible.');
  const parts=await Promise.all([0,1,2].map(i=>fetch(`./_payload/0${i}.txt`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`Payload ${i}: HTTP ${r.status}`);return r.text()})));
  const b64=parts.join('').trim();
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){
  console.error(e);
  status.textContent='Erreur de chargement : '+(e?.message||e);
 }
})();
</script>
</body>
</html>
