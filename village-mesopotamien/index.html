<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160f0a"><title>Chargement — Marché d’Ur</title><style>html,body{height:100%;margin:0;background:#160f0a;color:#f2d6aa;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.box{text-align:center}.spin{width:34px;height:34px;margin:0 auto 18px;border:3px solid #61472d;border-top-color:#e7b96d;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{opacity:.65}</style></head><body><div class="box"><div class="spin"></div><strong>Construction de la cité d’Ur…</strong><br><small>Chargement de la scène 3D</small></div><script>(async()=>{try{let source='';for(let i=1;i<=9;i++){const n=String(i).padStart(2,'0');const r=await fetch('./parts/part-'+n+'.txt',{cache:'no-cache'});if(!r.ok)throw new Error('Bloc '+n+' indisponible');source+=await r.text();}document.open();document.write(source);document.close();}catch(e){document.body.innerHTML='<div class="box"><strong>Impossible de charger la scène.</strong><br><small>'+String(e.message||e)+'</small></div>';console.error(e);}})();</script></body></html>
